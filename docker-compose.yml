# version: "3.8" # the attribute `version` is obsolete

services:
  backend:
    #container_name: backend # explicit container name conflicts with scalabillity
    build: ./backend/
    networks:
      - docker-network
    expose:
      - "8081" # explicit mapping ports: "8081:8081" prevents scaling
    mem_limit: 256m
    cpus: 0.5
    cap_drop:
      - ALL
    read_only: true
    restart: on-failure

  frontend:
    #container_name: frontend
    build:
      context: ./frontend
      args:
        VUE_APP_API_URL: /api # can be something else, see nginx.conf with proxy_pass to backend
    networks:
      - docker-network
    ports:
      - "80:80"
    mem_limit: 64m
    cpus: 0.1
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro # instead of copying it in Dockerfile
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE # only because nginx uses a well-known port 80
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    restart: on-failure

networks:
  docker-network:
    driver: bridge
